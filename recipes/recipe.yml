---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: kinoite-tln

# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 44 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
      copr:
        - bieszczaders/kernel-cachyos-addons
      repo:
        - https://cdn.jsdelivr.net/gh/terrapkg/packages@refs/heads/frawhide/anda/terra/release/terra.repo
    install:
      packages:
        - terra-release
        - terra-gpg-keys
        - terra-release-mesa
  - type: dnf
    install:
      packages:
        - hardinfo2
        - fonts-tweak-tool
        - ksystemlog
        - fish
        - android-tools
        - scx-scheds
        - scx-manager
        - distrobox
        - proton-vpn-gtk-app
        - libavcodec-freeworld
        - rocm-hip
        - rocm-clinfo
        - rocm-opencl
        - rocm-smi
    remove:
      packages:
        # example: removing firefox (in favor of the flatpak)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - firefox-langpacks
        - krfb
        - toolbox
    replace:
      - from-repo: rpmfusion-free
        packages:
          - old: mesa-vulkan-drivers
            new: mesa-vulkan-drivers-freeworld
#  - type: script
#    scripts:
#        - example.sh # example: run files/scripts/myscript.sh
      
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
